<style>
        body {

            -webkit-tap-highlight-color: transparent;

<body class="font-body-md text-on-surface">
<!-- Top Navigation Anchor (Shared Component Logic) -->
<header class="fixed top-0 w-full z-50 bg-background border-b border-outline-variant/30 px-margin-mobile h-16 flex justify-between items-center max-w-screen-xl mx-auto">
<button class="w-10 h-10 flex items-center justify-center hover:opacity-70 transition-opacity active:scale-95 duration-200">
<span class="material-symbols-outlined text-primary">menu</span>
</button>
<h1 class="font-headline-lg-mobile text-headline-lg-mobile text-on-background tracking-tight">TaskFlow</h1>
<button class="w-10 h-10 flex items-center justify-center rounded-full overflow-hidden hover:opacity-70 transition-opacity active:scale-95 duration-200">
<span class="material-symbols-outlined text-primary">chat_bubble</span>
</button>
</header>
<!-- Main Canvas -->
<main class="flex flex-col h-screen pt-16 pb-32 overflow-hidden relative">
<!-- Logo Watermark Background -->
<div class="absolute inset-0 flex items-center justify-center logo-watermark">
<span class="material-symbols-outlined text-[200px]" style="font-variation-settings: 'wght' 100;">auto_stories</span>
</div>
<!-- Chat History Area -->
<div class="flex-1 overflow-y-auto px-margin-mobile py-lg space-y-lg z-10" id="chat-container">
<!-- Initial State / Empty View -->
<div class="flex flex-col items-center justify-center h-full text-center space-y-sm opacity-60">
<span class="material-symbols-outlined text-primary text-5xl mb-base">auto_awesome</span>
<h2 class="font-title-md text-title-md text-on-surface-variant">How can I help you focus today?</h2>
<p class="font-body-md text-body-md px-lg">Describe your day, and I'll handle the scheduling for you.</p>
</div>
</div>
<!-- Floating Quick Actions & Input Area -->
<div class="fixed bottom-0 left-0 w-full px-margin-mobile pb-sm pt-base z-50 bg-gradient-to-t from-background via-background to-transparent">
<!-- Quick Action Pills -->
<div class="flex gap-xs overflow-x-auto pb-sm no-scrollbar">
<button class="flex-shrink-0 px-sm py-xs bg-surface-container-lowest border border-outline-variant/30 rounded-full text-label-sm font-label-sm text-primary hover:bg-surface-container transition-colors active:scale-95">
                    Schedule my week
                </button>
<button class="flex-shrink-0 px-sm py-xs bg-surface-container-lowest border border-outline-variant/30 rounded-full text-label-sm font-label-sm text-primary hover:bg-surface-container transition-colors active:scale-95">
                    Prioritize tomorrow
                </button>
<button class="flex-shrink-0 px-sm py-xs bg-surface-container-lowest border border-outline-variant/30 rounded-full text-label-sm font-label-sm text-primary hover:bg-surface-container transition-colors active:scale-95">
                    Morning routine
                </button>
</div>
<!-- AI Input Shell -->
<div class="relative flex items-center bg-white border border-outline-variant/50 rounded-full px-sm py-xs custom-shadow">
<button class="p-xs text-on-surface-variant hover:text-primary transition-colors">
<span class="material-symbols-outlined">add</span>
</button>
<input class="flex-1 bg-transparent border-none focus:ring-0 text-body-md font-body-md px-xs text-on-surface placeholder:text-outline/50" placeholder="Plan with AI..." type="text"/>
<div class="flex items-center gap-xs">
<button class="p-xs text-on-surface-variant hover:text-primary transition-colors">
<span class="material-symbols-outlined">mic</span>
</button>
<button class="w-10 h-10 bg-primary text-on-primary rounded-full flex items-center justify-center active:scale-90 transition-transform" id="send-btn">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">graphic_eq</span>
</button>
</div>
</div>
</div>
</main>
<!-- Bottom Navigation Shell (Shared Component Logic - Suppressed per Relevance Rule for Transactional/Focused UI) -->
<!-- Navigation suppressed to prioritize focus in the AI Plan conversational interface. -->
<script>
        // Simple Interaction Logic for Demo
        const chatContainer = document.getElementById('chat-container');
        const sendBtn = document.getElementById('send-btn');
        const inputField = document.querySelector('input');

        function appendMessage(text, isUser = false) {
            // Remove empty state if present
            const emptyState = chatContainer.querySelector('div.opacity-60');
            if (emptyState) emptyState.remove();

            const messageDiv = document.createElement('div');
            messageDiv.className = `flex ${isUser ? 'justify-end' : 'justify-start'} message-fade-in mb-sm`;
            
            const innerDiv = document.createElement('div');
            innerDiv.className = isUser 
                ? 'max-w-[80%] bg-primary-container text-on-primary-container p-sm rounded-xl rounded-tr-none font-body-md' 
                : 'max-w-[80%] bg-white border border-outline-variant/30 p-sm rounded-xl rounded-tl-none font-title-md text-on-surface';
            
            innerDiv.textContent = text;
            messageDiv.appendChild(innerDiv);
            chatContainer.appendChild(messageDiv);
            
            chatContainer.scrollTo({ top: chatContainer.scrollHeight, behavior: 'smooth' });
        }

        sendBtn.addEventListener('click', () => {
            const val = inputField.value.trim();
            if (val) {
                appendMessage(val, true);
                inputField.value = '';
                
                // Mock AI response
                setTimeout(() => {
                    appendMessage("Understood. I'll arrange your deep work sessions for tomorrow morning and clear your calendar for that project launch.", false);
                }, 800);
            }
        });

        inputField.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') sendBtn.click();
        });
    </script>
