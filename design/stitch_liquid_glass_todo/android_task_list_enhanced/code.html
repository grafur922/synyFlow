<style>

        .hide-scrollbar {

            scrollbar-width: none;
        }
        /* Entrance animation definitions */
        @keyframes slideInUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        @keyframes scaleIn {
            from {
                opacity: 0;
                transform: scale(0.8);
            }
            to {
                opacity: 1;
                transform: scale(1);
            }
        }
        .animate-staggered-entry {
            opacity: 0;
            animation: slideInUp 500ms ease-out forwards;

        .animate-fab-entry {

<script>
    // Animations are handled via CSS classes and keyframes for better performance
    // The previous scroll reveal is redundant with the new stagger approach but kept for general page readiness
    document.addEventListener('DOMContentLoaded', () => {
        // Accessibility: Ensure reduced motion preference is respected
        if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) {
            const animatedElements = document.querySelectorAll('.animate-staggered-entry, .animate-fab-entry');
            animatedElements.forEach(el => {
                el.style.animation = 'none';
                el.style.opacity = '1';
                el.style.transform = 'none';
            });
        }
    });
</script>
