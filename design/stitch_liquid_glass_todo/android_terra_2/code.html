<!DOCTYPE html>

<html lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Terra - Task Details</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>

<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>

          darkMode: "class",
          theme: {
            extend: {
              "colors": {
                      "surface-container-low": "#f5f1ea",
                      "surface-bright": "#faf6f0",
                      "outline-variant": "#c4c8bc",
                      "primary-container": "#78a886",
                      "outline": "#74796e",
                      "on-primary-fixed": "#002110",
                      "tertiary-fixed": "#f8e0a8",
                      "primary": "#4a7c59",
                      "inverse-primary": "#8ecf9e",
                      "on-error-container": "#690005",
                      "on-secondary-fixed": "#1e1a13",
                      "secondary-fixed-dim": "#d4ccbf",
                      "surface-container-highest": "#e4e0d8",
                      "surface-tint": "#4a7c59",
                      "secondary": "#6b6358",
                      "on-surface-variant": "#4a4e4a",
                      "on-background": "#2e3230",
                      "on-primary-fixed-variant": "#2a6038",
                      "tertiary-container": "#c4a66a",
                      "surface-container-high": "#eae6de",
                      "secondary-container": "#f0e8db",
                      "on-tertiary": "#ffffff",
                      "surface-variant": "#e4e0d8",
                      "primary-fixed": "#c8e8d0",
                      "on-error": "#ffffff",
                      "tertiary": "#705c30",
                      "on-surface": "#2e3230",
                      "on-secondary": "#ffffff",
                      "surface": "#faf6f0",
                      "primary-fixed-dim": "#8ecf9e",
                      "on-tertiary-container": "#554020",
                      "on-primary-container": "#d8f0de",
                      "surface-container-lowest": "#ffffff",
                      "error-container": "#ffdad8",
                      "on-tertiary-fixed-variant": "#554020",
                      "inverse-surface": "#2e3230",
                      "tertiary-fixed-dim": "#dcc48e",
                      "on-secondary-container": "#5e5548",
                      "on-tertiary-fixed": "#221a05",
                      "surface-container": "#f0ece4",
                      "inverse-on-surface": "#f5f0e8",
                      "background": "#faf6f0",
                      "on-secondary-fixed-variant": "#4a4538",
                      "secondary-fixed": "#f0e8db",
                      "on-primary": "#ffffff",

              },
              "borderRadius": {
                      "DEFAULT": "0.5rem",
                      "lg": "1rem",
                      "xl": "1.5rem",
                      "full": "9999px"

              "spacing": {},

                      "headline": [
                              "Literata"
                      ],
                      "display": [

                      ],
                      "label": [
                              "Nunito Sans"
                      ]
              },
              "fontSize": {}
      },
          },
        }
      </script>
<style>
        body {
            font-family: 'Nunito Sans', sans-serif;
            background-color: #faf6f0;
            color: #2e3230;
        }
        h1, h2, h3, h4, h5, h6 {
            font-family: 'Literata', serif;
        }
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .material-symbols-outlined.filled {
            font-variation-settings: 'FILL' 1, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background min-h-screen flex flex-col font-body antialiased">
<!-- TopAppBar (Transactional - Hidden/Back Only) -->
<header class="w-full sticky top-0 z-50 bg-background flex items-center justify-between px-6 py-4">
<button class="p-2 rounded-full hover:bg-surface-container-high transition-colors active:scale-95 duration-200 text-on-surface-variant flex items-center justify-center">
<span class="material-symbols-outlined text-2xl">arrow_back</span>
</button>
<h1 class="font-headline text-headline-md font-bold text-primary leading-relaxed absolute left-1/2 -translate-x-1/2">Task Details</h1>
<button class="p-2 rounded-full hover:bg-surface-container-high transition-colors active:scale-95 duration-200 text-on-surface-variant flex items-center justify-center">
<span class="material-symbols-outlined text-2xl">more_vert</span>
</button>
</header>
<main class="flex-grow px-6 pt-4 pb-32 flex flex-col gap-8 max-w-md mx-auto w-full">
<!-- Task Title -->
<section class="flex flex-col gap-2">
<input class="w-full bg-transparent border-none text-3xl font-headline font-bold text-on-background placeholder:text-outline p-0 focus:ring-0 leading-tight" placeholder="Task Name" type="text" value="Review Q3 Financial Report"/>
</section>
<!-- Category -->
<section class="flex flex-col gap-4">
<h2 class="font-label text-sm font-semibold tracking-wide text-secondary uppercase">Category</h2>
<div class="flex gap-4">
<button class="flex flex-col items-center justify-center gap-2 p-4 rounded-xl bg-primary-container text-on-primary-container w-24 aspect-square transition-colors active:scale-95 duration-200 shadow-[0_4px_20px_rgba(46,50,48,0.06)]">
<span class="material-symbols-outlined filled text-3xl">work</span>
<span class="font-label text-xs font-semibold">Work</span>
</button>
<button class="flex flex-col items-center justify-center gap-2 p-4 rounded-xl bg-surface-container-low text-on-surface-variant border border-outline-variant/30 hover:bg-surface-container-high w-24 aspect-square transition-colors active:scale-95 duration-200">
<span class="material-symbols-outlined text-3xl">home</span>
<span class="font-label text-xs font-semibold">Personal</span>
</button>
<button class="flex flex-col items-center justify-center gap-2 p-4 rounded-xl bg-surface-container-low text-on-surface-variant border border-outline-variant/30 hover:bg-surface-container-high w-24 aspect-square transition-colors active:scale-95 duration-200">
<span class="material-symbols-outlined text-3xl">add</span>
<span class="font-label text-xs font-semibold">New</span>
</button>
</div>
</section>
<!-- Due Date -->
<section class="flex flex-col gap-4">
<div class="flex justify-between items-end">
<h2 class="font-label text-sm font-semibold tracking-wide text-secondary uppercase">Date</h2>
<span class="text-sm font-body text-primary font-semibold">October 2023</span>
</div>
<div class="flex justify-between items-center bg-surface-container-low p-4 rounded-xl border border-outline-variant/30 shadow-[0_4px_20px_rgba(46,50,48,0.06)]">
<div class="flex flex-col items-center gap-1 opacity-50">
<span class="text-xs font-label">Mon</span>
<span class="text-lg font-headline">16</span>
</div>
<div class="flex flex-col items-center gap-1 opacity-50">
<span class="text-xs font-label">Tue</span>
<span class="text-lg font-headline">17</span>
</div>
<div class="flex flex-col items-center gap-1 bg-primary text-on-primary rounded-xl px-4 py-2 shadow-sm scale-110">
<span class="text-xs font-label font-semibold">Wed</span>
<span class="text-xl font-headline font-bold">18</span>
</div>
<div class="flex flex-col items-center gap-1 opacity-50">
<span class="text-xs font-label">Thu</span>
<span class="text-lg font-headline">19</span>
</div>
<div class="flex flex-col items-center gap-1 opacity-50">
<span class="text-xs font-label">Fri</span>
<span class="text-lg font-headline">20</span>
</div>
</div>
</section>
<!-- Priority -->
<section class="flex flex-col gap-4">
<h2 class="font-label text-sm font-semibold tracking-wide text-secondary uppercase">Priority</h2>
<div class="flex bg-surface-container-low rounded-xl p-1 border border-outline-variant/30">
<button class="flex-1 py-3 text-center rounded-lg text-on-surface-variant font-label text-sm font-semibold hover:bg-surface-container-high transition-colors">Low</button>
<button class="flex-1 py-3 text-center rounded-lg bg-tertiary text-on-tertiary shadow-sm font-label text-sm font-semibold transition-colors">Medium</button>
<button class="flex-1 py-3 text-center rounded-lg text-on-surface-variant font-label text-sm font-semibold hover:bg-surface-container-high transition-colors">High</button>
</div>
</section>
<!-- Notes -->
<section class="flex flex-col gap-4 flex-grow">
<h2 class="font-label text-sm font-semibold tracking-wide text-secondary uppercase">Notes</h2>
<textarea class="w-full flex-grow min-h-[120px] bg-surface-container-low border border-outline-variant/30 rounded-xl p-4 font-body text-base text-on-background placeholder:text-outline-variant focus:ring-2 focus:ring-primary/50 focus:border-primary resize-none shadow-[0_4px_20px_rgba(46,50,48,0.06)]" placeholder="Add any details or subtasks here..."></textarea>
</section>
</main>
<!-- Save Button Container -->
<div class="fixed bottom-0 left-0 w-full bg-gradient-to-t from-background via-background to-transparent pt-8 pb-6 px-6 z-40">
<div class="max-w-md mx-auto w-full">
<button class="w-full bg-primary text-on-primary py-4 rounded-xl font-label text-lg font-bold shadow-[0_4px_20px_rgba(46,50,48,0.06)] hover:bg-on-primary-fixed-variant transition-colors active:scale-95 duration-200">
                Save Changes
            </button>
</div>
</div>
</body></html>
